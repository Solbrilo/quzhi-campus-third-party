# Scoped extension to the existing activity collector. The two legacy activity routes stay unchanged.
location = /project-qzxy-console { return 302 /project-qzxy-console/; }
location ^~ /project-qzxy-console/ {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8101;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Connection close;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header X-Console-Client $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
}
location = /api/hotwater-notices {
    access_log off;
    error_log /dev/null crit;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8101;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Connection close;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
}
location = /api/hotwater-notices/response {
    access_log off;
    error_log /dev/null crit;
    limit_except POST { deny all; }
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8101;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Connection close;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
}
