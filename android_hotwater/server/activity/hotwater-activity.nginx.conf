# Anonymous usage endpoint. Do not log IP addresses, query strings or payloads.
location = /api/hotwater-activity {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 256;
    client_body_buffer_size 1k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8101;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header Host localhost;
    proxy_set_header Connection close;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}
location = /api/hotwater-activity/monthly {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 256;
    client_body_buffer_size 1k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8101/api/hotwater-activity/monthly;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header Host localhost;
    proxy_set_header Connection close;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}
location ^~ /api/hotwater-activity/ {
    access_log off;
    error_log /dev/null crit;
    return 404;
}
